name: Test on Jellyfin 12

# Runs a real Jellyfin 12 server with Artwork Studio, Pre-Roll Videos and Bulk Metadata Editor,
# drives it with a browser and stores screenshots + results on the "ci-results" branch.
on:
  workflow_dispatch:
    inputs:
      jellyfin_tag:
        description: 'Jellyfin image tag(s) to try, space separated'
        default: '12.4'
      branch:
        description: 'Branch to use for the other three plugins'
        default: 'main'
  push:
    branches: [ main ]
    paths: [ 'Jellyfin.Plugin.ArtworkStudio/**', 'ci/e2e/**', 'tv/launcher/**', '.github/workflows/e2e-jellyfin12.yml' ]

permissions:
  contents: write

concurrency:
  group: e2e-jellyfin12
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: justhallwest-commits/jellyfin-preroll-ugreen
          path: ext/preroll
          ref: ${{ github.event.inputs.branch || 'main' }}

      - uses: actions/checkout@v4
        with:
          repository: justhallwest-commits/jellyfin-bulk-metadata
          path: ext/bulk
          ref: ${{ github.event.inputs.branch || 'main' }}

      - uses: actions/checkout@v4
        with:
          repository: justhallwest-commits/jellyfin-content-guard
          path: ext/guard
          ref: ${{ github.event.inputs.branch || 'main' }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Compile check for Jellyfin 10.10 and 10.11
        run: |
          mkdir -p ci/e2e/results
          R=ci/e2e/results/compat-builds.txt; : > $R
          b() { name=$1; shift; if dotnet build "$@" -c Release -o "/tmp/compat/$name" > "/tmp/$name.log" 2>&1; then echo "$name: ok" >> $R; else echo "$name: FAILED" >> $R; grep -E "error" "/tmp/$name.log" | sort -u | head -15 >> $R; fi; }
          b as-1010 Jellyfin.Plugin.ArtworkStudio/Jellyfin.Plugin.ArtworkStudio.csproj -p:JellyfinVersion=10.10.7 -p:JellyfinTfm=net8.0
          rm -rf Jellyfin.Plugin.ArtworkStudio/obj Jellyfin.Plugin.ArtworkStudio/bin
          b as-1011 Jellyfin.Plugin.ArtworkStudio/Jellyfin.Plugin.ArtworkStudio.csproj -p:JellyfinVersion=10.11.0 -p:JellyfinTfm=net9.0
          rm -rf Jellyfin.Plugin.ArtworkStudio/obj Jellyfin.Plugin.ArtworkStudio/bin
          b pr-1010 ext/preroll/JellyfinPreroll/JellyfinPreroll.csproj -p:JellyfinAbi=10.10
          rm -rf ext/preroll/JellyfinPreroll/obj ext/preroll/JellyfinPreroll/bin
          b pr-1011 ext/preroll/JellyfinPreroll/JellyfinPreroll.csproj -p:JellyfinAbi=10.11
          rm -rf ext/preroll/JellyfinPreroll/obj ext/preroll/JellyfinPreroll/bin
          b bm-1010 ext/bulk/Jellyfin.Plugin.BulkMetadata/Jellyfin.Plugin.BulkMetadata.csproj
          rm -rf ext/bulk/Jellyfin.Plugin.BulkMetadata/obj ext/bulk/Jellyfin.Plugin.BulkMetadata/bin
          b cg-1010 ext/guard/Jellyfin.Plugin.ContentGuard/Jellyfin.Plugin.ContentGuard.csproj -p:JellyfinVersion=10.10
          rm -rf ext/guard/Jellyfin.Plugin.ContentGuard/obj ext/guard/Jellyfin.Plugin.ContentGuard/bin
          b cg-1011 ext/guard/Jellyfin.Plugin.ContentGuard/Jellyfin.Plugin.ContentGuard.csproj -p:JellyfinVersion=10.11
          rm -rf ext/guard/Jellyfin.Plugin.ContentGuard/obj ext/guard/Jellyfin.Plugin.ContentGuard/bin
          cat $R

      - name: Build the three plugins for Jellyfin 12
        id: build
        run: |
          set +e
          JV=""
          for v in 12.0.0 12.0.1 12.1.0 12.2.0 12.3.0 12.4.0; do
            if dotnet build Jellyfin.Plugin.ArtworkStudio/Jellyfin.Plugin.ArtworkStudio.csproj -c Release -p:JellyfinVersion=$v -p:JellyfinTfm=net10.0 -o out/as > build-as.log 2>&1; then JV=$v; break; fi
          done
          echo "Artwork Studio built against: ${JV:-FAILED}"; tail -20 build-as.log
          mkdir -p ci/e2e/results; grep -E " error " build-as.log | sort -u | head -30 > ci/e2e/results/build-as-errors.txt || true
          [ -n "$JV" ] || exit 1
          echo "jv=$JV" >> "$GITHUB_OUTPUT"
          mkdir -p ci/e2e/plugins/ArtworkStudio ci/e2e/plugins/PreRollVideos ci/e2e/plugins/BulkMetadata ci/e2e/results
          cp out/as/Jellyfin.Plugin.ArtworkStudio.dll ci/e2e/plugins/ArtworkStudio/
          dotnet publish ext/preroll/JellyfinPreroll -c Release -o out/pr -p:JellyfinAbi=12 -p:JellyfinPackageVersion=$JV > ci/e2e/results/build-preroll.log 2>&1 \
            && cp out/pr/JellyfinPreroll.dll ci/e2e/plugins/PreRollVideos/ || { echo "PRE-ROLL BUILD FAILED"; tail -30 ci/e2e/results/build-preroll.log; rmdir ci/e2e/plugins/PreRollVideos; }
          dotnet publish ext/bulk/Jellyfin.Plugin.BulkMetadata -c Release -o out/bm -p:JellyfinVersion=$JV -p:JellyfinTfm=net10.0 > ci/e2e/results/build-bulk.log 2>&1 \
            && cp out/bm/Jellyfin.Plugin.BulkMetadata.dll ci/e2e/plugins/BulkMetadata/ || { echo "BULK BUILD FAILED"; tail -30 ci/e2e/results/build-bulk.log; rmdir ci/e2e/plugins/BulkMetadata; }
          mkdir -p ci/e2e/plugins/ContentGuard
          dotnet publish ext/guard/Jellyfin.Plugin.ContentGuard -c Release -o out/cg -p:JellyfinVersion=12.0 > ci/e2e/results/build-guard.log 2>&1 \
            && cp out/cg/Jellyfin.Plugin.ContentGuard.dll ci/e2e/plugins/ContentGuard/ || { echo "CONTENT GUARD BUILD FAILED"; tail -30 ci/e2e/results/build-guard.log; rmdir ci/e2e/plugins/ContentGuard; }
          cp build-as.log ci/e2e/results/build-artwork-studio.log
          exit 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser
        working-directory: ci/e2e
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run Jellyfin 12 and test
        working-directory: ci/e2e
        env:
          JELLYFIN_TAGS: ${{ github.event.inputs.jellyfin_tag || '12.4' }}
        run: bash run.sh

      # ---- the Jellyfin Media Player desktop app (old Chromium inside), against the same server
      - name: Jellyfin Media Player desktop app
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Flathub has moved this app on to Jellyfin Desktop 2, so take Jellyfin Media Player 1.12
          # (Qt 5.15 WebEngine, the old Chromium people still have on Windows) from its own release
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          gh api repos/jellyfin/jellyfin-desktop/releases --jq '.[0:6][] | .tag_name as $t | .assets[] | [$t, .name, .browser_download_url] | @tsv' | tee /tmp/jmp-assets.txt
          DEB=$(grep -E 'jellyfin-media-player_[0-9.]+-noble\.deb' /tmp/jmp-assets.txt | head -1 | cut -f3)
          echo "deb: $DEB"
          set +e
          curl -fsSL -o /tmp/jmp.deb "$DEB"; ls -la /tmp/jmp.deb
          dpkg-deb -f /tmp/jmp.deb Depends
          sudo apt-get install -y /tmp/jmp.deb > /tmp/jmp-apt.log 2>&1; echo "apt exit $?"; tail -25 /tmp/jmp-apt.log
          which jellyfinmediaplayer && dpkg -s libqt5webenginecore5 2>/dev/null | grep -i '^version' || true
          bash ci/e2e/jmp.sh

      # ---- the Android TV / Fire TV app on an emulator, against the same server
      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: always()
        with:
          gradle-version: '8.10.2'

      - name: Build the Android TV app
        if: always()
        id: apk
        continue-on-error: true
        working-directory: tv/android
        run: |
          HALLFLIX_KEYSTORE=$PWD/hallflix-sideload.jks HALLFLIX_KEYSTORE_PASSWORD=$(cat hallflix-sideload.password) gradle --no-daemon -q assembleRelease
          mkdir -p ../../out && cp app/build/outputs/apk/release/app-release.apk ../../out/HallFlix-AndroidTV.apk

      - name: Enable KVM
        if: always() && steps.apk.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Android TV emulator
        if: always() && steps.apk.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/e2e/android.sh

      - name: Check the UGREEN plugin installer against the published catalog
        if: always()
        run: |
          mkdir -p inst ci/e2e/results
          docker run --rm -v "$PWD/inst:/config" alpine:3.20 sh -c "wget -qO /tmp/i.sh https://raw.githubusercontent.com/${{ github.repository }}/main/ugreen/install-plugins.sh && sh /tmp/i.sh" > ci/e2e/results/installer.log 2>&1 || true
          echo '--- second run (should skip everything)' >> ci/e2e/results/installer.log
          docker run --rm -v "$PWD/inst:/config" alpine:3.20 sh -c "wget -qO /tmp/i.sh https://raw.githubusercontent.com/${{ github.repository }}/main/ugreen/install-plugins.sh && sh /tmp/i.sh" >> ci/e2e/results/installer.log 2>&1 || true
          echo '--- files' >> ci/e2e/results/installer.log
          (cd inst && find plugins -type f | sort) >> ci/e2e/results/installer.log 2>&1 || true

      - name: Store results on the ci-results branch
        if: always()
        run: |
          cd ci/e2e/results
          echo "${{ github.sha }}" > commit.txt
          echo "${{ steps.build.outputs.jv }}" > built-against.txt
          git init -q . && git checkout -q -b ci-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "E2E results for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
