name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="1.0.0"
          fi
          # Jellyfin wants four parts: 1.2.3 -> 1.2.3.0
          IFS='.' read -r a b c d <<< "$V"
          echo "version=${a:-1}.${b:-0}.${c:-0}.${d:-0}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          dotnet build Jellyfin.Plugin.ArtworkStudio/Jellyfin.Plugin.ArtworkStudio.csproj \
            -c Release \
            -p:AssemblyVersion=${{ steps.ver.outputs.version }} \
            -p:FileVersion=${{ steps.ver.outputs.version }} \
            -o out

      - name: Package
        id: pkg
        run: |
          mkdir -p dist
          ZIP="artwork-studio_${{ steps.ver.outputs.version }}.zip"
          (cd out && zip -j "../dist/$ZIP" Jellyfin.Plugin.ArtworkStudio.dll)
          MD5=$(md5sum "dist/$ZIP" | cut -d' ' -f1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"

      - name: Write repository manifest
        run: |
          cat > dist/manifest.json <<EOF
          [
            {
              "guid": "7143ab64-23ea-4969-b0b9-672c6893c4b3",
              "name": "Artwork Studio",
              "description": "Add and manage posters, backdrops, logos and more for libraries and items — from uploads, web links, your NAS, or online providers.",
              "overview": "A friendly artwork manager for Jellyfin.",
              "owner": "${{ github.repository_owner }}",
              "category": "General",
              "versions": [
                {
                  "version": "${{ steps.ver.outputs.version }}",
                  "changelog": "See GitHub release notes.",
                  "targetAbi": "10.11.0.0",
                  "sourceUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.pkg.outputs.zip }}",
                  "checksum": "${{ steps.pkg.outputs.md5 }}",
                  "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                }
              ]
            }
          ]
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: artwork-studio
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.pkg.outputs.zip }}
            dist/manifest.json
          generate_release_notes: true
