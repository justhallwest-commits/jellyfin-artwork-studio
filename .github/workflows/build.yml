name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Bump this for bigger releases; the last number goes up automatically on every push to main.
  BASE_VERSION: '1.0'
  PROJECT: Jellyfin.Plugin.ArtworkStudio/Jellyfin.Plugin.ArtworkStudio.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          fi
          IFS='.' read -r a b c _ <<< "$V"
          BASE="${a:-1}.${b:-0}.${c:-0}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "tag=v$BASE" >> "$GITHUB_OUTPUT"
          # The last number marks the Jellyfin line, so a 10.11 server prefers the 10.11 build
          echo "v1010=$BASE.10" >> "$GITHUB_OUTPUT"
          echo "v1011=$BASE.11" >> "$GITHUB_OUTPUT"
          echo "v12=$BASE.12" >> "$GITHUB_OUTPUT"

      - name: Build for Jellyfin 10.10 (.NET 8)
        run: |
          rm -rf Jellyfin.Plugin.ArtworkStudio/bin Jellyfin.Plugin.ArtworkStudio/obj
          dotnet build "$PROJECT" -c Release \
            -p:JellyfinVersion=10.10.7 -p:JellyfinTfm=net8.0 \
            -p:AssemblyVersion=${{ steps.ver.outputs.v1010 }} -p:FileVersion=${{ steps.ver.outputs.v1010 }} \
            -o out-1010

      - name: Build for Jellyfin 10.11 (.NET 9)
        run: |
          rm -rf Jellyfin.Plugin.ArtworkStudio/bin Jellyfin.Plugin.ArtworkStudio/obj
          dotnet build "$PROJECT" -c Release \
            -p:JellyfinVersion=10.11.0 -p:JellyfinTfm=net9.0 \
            -p:AssemblyVersion=${{ steps.ver.outputs.v1011 }} -p:FileVersion=${{ steps.ver.outputs.v1011 }} \
            -o out-1011

      - name: Build for Jellyfin 12 (.NET 10)
        id: b12
        run: |
          # Built against the oldest 12.x packages that exist, so it loads on every 12.x server
          for JV in 12.0.0 12.0.1 12.1.0 12.2.0 12.3.0 12.4.0; do
            rm -rf Jellyfin.Plugin.ArtworkStudio/bin Jellyfin.Plugin.ArtworkStudio/obj
            if dotnet build "$PROJECT" -c Release \
                -p:JellyfinVersion=$JV -p:JellyfinTfm=net10.0 \
                -p:AssemblyVersion=${{ steps.ver.outputs.v12 }} -p:FileVersion=${{ steps.ver.outputs.v12 }} \
                -o out-12; then
              echo "Built against Jellyfin $JV"; echo "jv=$JV" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          exit 1

      - name: Package
        id: pkg
        run: |
          mkdir -p dist
          Z10="artwork-studio_${{ steps.ver.outputs.v1010 }}_jellyfin-10.10.zip"
          Z11="artwork-studio_${{ steps.ver.outputs.v1011 }}_jellyfin-10.11.zip"
          (cd out-1010 && zip -j "../dist/$Z10" Jellyfin.Plugin.ArtworkStudio.dll)
          (cd out-1011 && zip -j "../dist/$Z11" Jellyfin.Plugin.ArtworkStudio.dll)
          Z12="artwork-studio_${{ steps.ver.outputs.v12 }}_jellyfin-12.zip"
          (cd out-12 && zip -j "../dist/$Z12" Jellyfin.Plugin.ArtworkStudio.dll)
          echo "z12=$Z12" >> "$GITHUB_OUTPUT"
          echo "md12=$(md5sum "dist/$Z12" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "z10=$Z10" >> "$GITHUB_OUTPUT"
          echo "z11=$Z11" >> "$GITHUB_OUTPUT"
          echo "md10=$(md5sum "dist/$Z10" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "md11=$(md5sum "dist/$Z11" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Write repository manifest
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}"
          cat > dist/manifest.json <<EOF
          [
            {
              "guid": "7143ab64-23ea-4969-b0b9-672c6893c4b3",
              "name": "Artwork Studio",
              "description": "Add and manage posters, backdrops, logos and more for libraries and items — from uploads, web links, your NAS, or online providers.",
              "overview": "A friendly artwork manager for Jellyfin.",
              "owner": "${{ github.repository_owner }}",
              "category": "General",
              "versions": [
                {
                  "version": "${{ steps.ver.outputs.v12 }}",
                  "changelog": "Build for Jellyfin 12.",
                  "targetAbi": "${{ steps.b12.outputs.jv }}.0",
                  "sourceUrl": "$URL/${{ steps.pkg.outputs.z12 }}",
                  "checksum": "${{ steps.pkg.outputs.md12 }}",
                  "timestamp": "$TS"
                },
                {
                  "version": "${{ steps.ver.outputs.v1011 }}",
                  "changelog": "Build for Jellyfin 10.11.",
                  "targetAbi": "10.11.0.0",
                  "sourceUrl": "$URL/${{ steps.pkg.outputs.z11 }}",
                  "checksum": "${{ steps.pkg.outputs.md11 }}",
                  "timestamp": "$TS"
                },
                {
                  "version": "${{ steps.ver.outputs.v1010 }}",
                  "changelog": "Build for Jellyfin 10.10.",
                  "targetAbi": "10.10.0.0",
                  "sourceUrl": "$URL/${{ steps.pkg.outputs.z10 }}",
                  "checksum": "${{ steps.pkg.outputs.md10 }}",
                  "timestamp": "$TS"
                }
              ]
            }
          ]
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: artwork-studio
          path: dist/*

      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Artwork Studio ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/${{ steps.pkg.outputs.z10 }}
            dist/${{ steps.pkg.outputs.z11 }}
            dist/${{ steps.pkg.outputs.z12 }}
            dist/manifest.json
          generate_release_notes: true
