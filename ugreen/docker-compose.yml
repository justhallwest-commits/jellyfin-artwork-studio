# HallFlix — Jellyfin 12 for a UGREEN NAS, with Artwork Studio, Pre-Roll Videos and
# Bulk Metadata Editor installed automatically.
#
# UGOS: Docker → Project → Create → paste this file. Before deploying, change the folder
# paths on the LEFT of each ":" to match your NAS (see ugreen/README.md).
#
# It runs next to your existing Jellyfin (App Center) on a different port (8097), so nothing
# about the current server changes until you decide to switch.

services:
  # Runs once before Jellyfin starts: downloads the newest Jellyfin 12 builds of the HallFlix
  # plugins into the config folder, then exits. Restarting the project picks up plugin updates.
  hallflix-plugins:
    image: alpine:3.20
    container_name: hallflix-plugins
    restart: "no"
    # Never blocks Jellyfin: without internet it just keeps the plugins already installed.
    entrypoint: ["/bin/sh", "-c", "wget -qO /tmp/install.sh https://raw.githubusercontent.com/justhallwest-commits/jellyfin-artwork-studio/main/ugreen/install-plugins.sh && sh /tmp/install.sh || echo 'HallFlix plugin helper skipped'; exit 0"]
    volumes:
      - /volume1/docker/jellyfin12/config:/config

  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin12
    depends_on:
      hallflix-plugins:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "8097:8096"          # web / apps:  http://<NAS-IP>:8097
    environment:
      - TZ=America/New_York
      - JELLYFIN_PublishedServerUrl=https://hallflix.net
    volumes:
      - /volume1/docker/jellyfin12/config:/config
      - /volume1/docker/jellyfin12/cache:/cache
      # Your media. Kept writable so Artwork Studio can save artwork next to your files.
      - /volume1/Media:/media
      # Optional: a folder of artwork for Artwork Studio's NAS browser (Settings → NAS folders → /artwork)
      # - /volume1/Artwork:/artwork:ro
    devices:
      - /dev/dri:/dev/dri    # Intel Quick Sync hardware transcoding (UGREEN DXP models)
