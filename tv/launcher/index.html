<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HallFlix</title>
<!-- HallFlix TV launcher: asks for the server once, then opens the HallFlix TV interface that the
     Artwork Studio plugin serves at <server>/ArtworkStudio/TV/. Shared by the LG, Samsung and
     Android TV / Fire TV apps. ES5 only. -->
<style>
html { font-size: 1.2vw; }
html, body { margin: 0; height: 100%; background: #0b0b0f; color: #fff; font-family: "Noto Sans", "LG Smart UI", "SamsungOne", Roboto, Arial, sans-serif; overflow: hidden; }
#bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 20% 110%, #4a050c 0%, rgba(11,11,15,0) 60%), #0b0b0f; }
#setup { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center; }
#setup.on { display: flex; }
.panel { width: 52vw; }
.brand { display: flex; align-items: center; margin-bottom: 4vh; }
.brand svg { width: 4.4rem; height: 4.4rem; margin-right: 1.2rem; }
.brand b { font-size: 3rem; letter-spacing: .06em; }
h1 { font-size: 1.7rem; font-weight: 600; margin: 0 0 1vh; }
p { color: #a9a9b4; font-size: 1.1rem; margin: 0 0 3vh; line-height: 1.5; }
input { box-sizing: border-box; width: 100%; font: inherit; font-size: 1.5rem; color: #fff; background: rgba(255,255,255,.07); border: .15rem solid rgba(255,255,255,.18); border-radius: .8rem; padding: .7em 1em; outline: none; }
.f.focused { border-color: #e50914; }
.row { margin-top: 3vh; }
button { font: inherit; font-size: 1.2rem; font-weight: 700; border: 0; border-radius: 999px; padding: .7em 2em; margin-right: 1rem; background: rgba(255,255,255,.14); color: #fff; }
button.focused { background: #e50914; transform: scale(1.06); }
#msg { min-height: 1.6em; margin-top: 2.6vh; font-size: 1.1rem; color: #ffb4b4; white-space: pre-line; }
#msg.busy { color: #a9a9b4; }
#ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: none; background: #0b0b0f; }
#ui.on { display: block; }
#spin { position: fixed; top: 50%; left: 50%; width: 3.2rem; height: 3.2rem; margin: -1.6rem 0 0 -1.6rem; border-radius: 50%; border: .3rem solid rgba(255,255,255,.15); border-top-color: #e50914; animation: s .9s linear infinite; display: none; }
#spin.on { display: block; }
@keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="bg"></div>
<div id="spin"></div>
<div id="setup">
  <div class="panel">
    <div class="brand">
      <svg viewBox="0 0 100 100"><path fill="#e50914" d="M18 16h20v68H18zM62 16h20v68H62z"/><path fill="#e50914" d="M37 31l29 19-29 19z"/></svg>
      <b>HALLFLIX</b>
    </div>
    <h1>Connect to your server</h1>
    <p>Type the address of your Jellyfin server, the same one you use in a web browser, for example <b>192.168.1.20:8096</b> or <b>hallflix.net</b>.</p>
    <input id="addr" class="f" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Server address">
    <div class="row"><button id="go" class="f">Connect</button><button id="cancel" class="f" style="display:none">Cancel</button></div>
    <div id="msg"></div>
  </div>
</div>
<iframe id="ui" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
<script>
(function () {
    'use strict';
    var q = {};
    location.search.replace(/^\?/, '').split('&').forEach(function (p) { var i = p.indexOf('='); if (p) { q[decodeURIComponent(i < 0 ? p : p.slice(0, i))] = i < 0 ? '' : decodeURIComponent(p.slice(i + 1)); } });
    var PLATFORM = q.platform || (window.tizen ? 'tizen' : /web0s|webos/i.test(navigator.userAgent) ? 'webos' : window.HallFlixNative ? 'android' : 'browser');
    var NATIVE = window.HallFlixNative || null;
    var $ = function (id) { return document.getElementById(id); };
    var addr = $('addr'), go = $('go'), cancel = $('cancel'), msg = $('msg'), ui = $('ui'), setup = $('setup'), spin = $('spin');

    function load(k) { try { if (NATIVE && NATIVE.getServer && k === 'hf-server') { return NATIVE.getServer() || null; } return localStorage.getItem(k); } catch (e) { return null; } }
    function save(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage off */ } }

    // ------------------------------------------------------------ Samsung remote keys
    if (window.tizen && tizen.tvinputdevice) {
        ['MediaPlayPause', 'MediaPlay', 'MediaPause', 'MediaStop', 'MediaFastForward', 'MediaRewind', 'ColorF0Red'].forEach(function (k) { try { tizen.tvinputdevice.registerKey(k); } catch (e) { /* not on this model */ } });
    }
    function exitApp() {
        try { if (window.tizen) { tizen.application.getCurrentApplication().exit(); return; } } catch (e) { /* ignore */ }
        try { if (window.webOS && webOS.platformBack) { webOS.platformBack(); return; } } catch (e2) { /* ignore */ }
        try { window.close(); } catch (e3) { /* ignore */ }
    }

    // ------------------------------------------------------------ focus for the setup form
    var fs = [addr, go, cancel], cur = null;
    function focus(el) { if (cur) { cur.classList.remove('focused'); } cur = el; el.classList.add('focused'); if (el === addr) { addr.focus(); } else { addr.blur(); } }
    function visibleF() { return fs.filter(function (e) { return e.style.display !== 'none'; }); }
    document.addEventListener('keydown', function (e) {
        var k = e.keyCode;
        if (ui.classList.contains('on')) {
            // keys that land here while the interface is open belong to it
            if (ui.contentWindow) { try { ui.contentWindow.postMessage(JSON.stringify({ hallflix: true, key: k }), '*'); } catch (x) { /* ignore */ } }
            e.preventDefault(); return;
        }
        var list = visibleF(), i = list.indexOf(cur);
        if (k === 38 || k === 40) { e.preventDefault(); focus(list[Math.max(0, Math.min(list.length - 1, (k === 40 ? (i === 0 ? 1 : i) : 0)))]); }
        else if ((k === 37 || k === 39) && cur !== addr) { e.preventDefault(); focus(list[Math.max(1, Math.min(list.length - 1, i + (k === 39 ? 1 : -1)))]); }
        else if (k === 13) { e.preventDefault(); if (cur === addr || cur === go) { connect(addr.value); } else if (cur === cancel) { cancel.onclick(); } }
        else if (k === 461 || k === 10009 || (k === 27) || (k === 8 && cur !== addr)) { e.preventDefault(); if (cancel.style.display !== 'none') { cancel.onclick(); } else { exitApp(); } }
    });
    addr.addEventListener('click', function () { focus(addr); });
    go.onclick = function () { connect(addr.value); };
    cancel.onclick = function () { var s = load('hf-server'); if (s) { open(s); } };

    // ------------------------------------------------------------ messages from the interface
    window.addEventListener('message', function (ev) {
        var m; try { m = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch (x) { return; }
        if (!m || !m.hallflix) { return; }
        if (m.action === 'exit') { exitApp(); }
        else if (m.action === 'changeServer') { showSetup(true); }
    });
    // Android's Back button while this page is showing
    window.HallFlix = { back: function () { if (setup.classList.contains('on') && cancel.style.display !== 'none') { cancel.onclick(); return true; } return false; } };

    // ------------------------------------------------------------ connecting
    function candidates(text) {
        var t = (text || '').trim().replace(/\/+$/, '').replace(/\/web(\/.*)?$/i, '').replace(/\/ArtworkStudio\/TV.*$/i, '');
        if (!t) { return []; }
        if (/^https?:\/\//i.test(t)) { return [t]; }
        var hostPort = /:\d+$/.test(t.split('/')[0]);
        var isIp = /^(\d{1,3}\.){3}\d{1,3}(:\d+)?(\/|$)/.test(t) || /^[a-z0-9-]+(:\d+)?(\/|$)/i.test(t) && t.indexOf('.') < 0;
        if (hostPort) { return ['http://' + t, 'https://' + t]; }
        if (isIp) { return ['http://' + t + ':8096', 'http://' + t, 'https://' + t + ':8920']; }
        return ['https://' + t, 'http://' + t + ':8096', 'http://' + t];
    }
    function get(url, timeout) {
        return new Promise(function (resolve, reject) {
            var x = new XMLHttpRequest(), done = false;
            x.open('GET', url);
            x.timeout = timeout || 6000;
            x.onload = function () { done = true; if (x.status >= 200 && x.status < 300) { try { resolve(JSON.parse(x.responseText)); } catch (e) { reject(new Error('bad')); } } else { var er = new Error('HTTP ' + x.status); er.status = x.status; reject(er); } };
            x.onerror = x.ontimeout = function () { if (!done) { reject(new Error('unreachable')); } };
            x.send();
        });
    }
    function tryOne(list, i, lastErr) {
        if (i >= list.length) { return Promise.reject(lastErr || new Error('unreachable')); }
        var base = list[i];
        return get(base + '/System/Info/Public').then(function (info) {
            if (!info || !info.Id) { throw new Error('notjellyfin'); }
            return get(base + '/ArtworkStudio/AppConfig').then(function () { return base; }, function (e) {
                var er = new Error('noplugin'); er.server = info.ServerName; throw er;
            });
        }).catch(function (e) { if (e.message === 'noplugin') { throw e; } return tryOne(list, i + 1, e); });
    }
    function connect(text) {
        var list = candidates(text);
        if (!list.length) { say('Type your server’s address first.'); focus(addr); return; }
        say('Looking for your server…', true);
        tryOne(list, 0).then(function (base) {
            save('hf-server', base);
            if (NATIVE && NATIVE.setServer) { NATIVE.setServer(base); return; }
            open(base);
        }, function (e) {
            if (e.message === 'noplugin') { say('Found ' + (e.server || 'the server') + ', but it doesn’t have Artwork Studio 1.0.35 or newer.\nUpdate Artwork Studio in Dashboard → Plugins, restart Jellyfin, then try again.'); }
            else { say('Couldn’t reach a Jellyfin server at that address.\nCheck it works in a web browser on the same network, including the port (usually 8096).'); }
            focus(addr);
        });
    }
    function say(t, busy) { msg.textContent = t; msg.className = busy ? 'busy' : ''; }
    function open(base) {
        var url = base + '/ArtworkStudio/TV/?platform=' + PLATFORM;
        if (PLATFORM === 'android' || PLATFORM === 'browser' && !q.frame) { location.href = url; return; }
        setup.classList.remove('on'); spin.classList.add('on');
        ui.onload = function () { spin.classList.remove('on'); ui.classList.add('on'); try { ui.contentWindow.focus(); } catch (e) { /* ignore */ } ui.focus(); };
        ui.src = url;
    }
    function showSetup(changing) {
        ui.classList.remove('on'); ui.src = 'about:blank'; spin.classList.remove('on');
        setup.classList.add('on');
        var s = load('hf-server');
        addr.value = s ? s.replace(/^http:\/\//, '') : (q.server || '');
        cancel.style.display = changing && s ? '' : 'none';
        say('');
        focus(addr);
    }
    // keep the interface focused so the remote's keys go to it
    window.addEventListener('focus', function () { if (ui.classList.contains('on')) { try { ui.contentWindow.focus(); } catch (e) { /* ignore */ } } });

    var saved = load('hf-server');
    if (saved && q.change === undefined) { open(saved); } else { showSetup(q.change !== undefined); }
})();
</script>
</body>
</html>
